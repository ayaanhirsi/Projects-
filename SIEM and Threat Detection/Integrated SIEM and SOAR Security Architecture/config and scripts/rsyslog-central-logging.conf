# CIS Control 8 — Audit Log Management
# Forwards auth, firewall, and system logs from each host to a central
# log collector, so logs survive even if an individual host is compromised.

*.* action(type="omfwd"
            target="siem.g5.local"
            port="6514"
            protocol="tcp"
            StreamDriver="gtls"
            StreamDriverMode="1"
            StreamDriverAuthMode="x509/name")

# Keep a local copy too, retained 90 days, in case the SIEM link drops.
$outchannel local_retain,/var/log/retained.log,104857600,/usr/bin/logrotate
*.* :omfile:$local_retain
