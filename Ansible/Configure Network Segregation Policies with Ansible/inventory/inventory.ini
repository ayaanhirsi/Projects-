; Ansible inventory for the segmented internal network.
; Groups map to the firewall profile each host type receives in
; roles/firewall/files/<inventory_hostname>_nft.conf

[core_router]
router1.g5.local ansible_user=admin

[ad]
l1ad.g5.local ansible_user=admin        ; Domain Controller + split-DNS resolver

[container]
container1.g5.local ansible_user=admin  ; Reverse proxy / internal+public web services

[user]
user1.g5.local ansible_user=admin

[admin]
localhost ansible_connection=local      ; Ansible control node

[internal_network:children]
ad
container
user
admin
