#!/usr/sbin/nft -f
# nftables profile: standard user workstation
# Deployed by Ansible to /etc/nftables.conf — do not edit on the host directly.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        iif "lo" accept

        # Allow SSH only from the Admin management subnet
        ip saddr 10.10.10.0/28 tcp dport 22 accept

        # Rate-limit new TCP connections to blunt SYN floods
        tcp flags syn limit rate 20/second accept
        tcp flags syn drop

        icmp type echo-request limit rate 5/second accept
        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
