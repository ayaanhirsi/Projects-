#!/usr/sbin/nft -f
# nftables profile: reverse proxy / container host
# Hosts the internal + public-facing web services behind the split-DNS design.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        iif "lo" accept

        ip saddr 10.10.10.0/28 tcp dport 22 accept   # Admin subnet SSH only

        tcp dport {80, 443} accept                    # Public reverse proxy traffic

        tcp flags syn limit rate 25/second accept
        tcp flags syn drop

        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # Allow proxy -> internal backends on 80 only; nothing else transits.
        ip daddr 10.10.10.0/24 tcp dport 80 accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
